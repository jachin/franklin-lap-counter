# Franklin simulator tmuxinator configuration
name: franklin-simulator
root: .

startup_window: lap-counter

pre_window: |
  source .venv/bin/activate
  export FRANKLIN_SESSION=tmux

windows:
  - redis:
      layout: main-horizontal
      panes:
        - redis-server:
            - echo "Starting Redis with Unix socket (logging to redis.log)..."
            - redis-server --port 0 --unixsocket ./redis.sock --unixsocketperm 700 --loglevel notice --logfile ./redis.log
  - hardware:
      layout: main-horizontal
      panes:
        - monitor:
            - echo "Waiting for Redis to be ready..."
            - sleep 2
            - echo "Starting Hardware Monitor (simulator mode)..."
            - cargo run --manifest-path rust/Cargo.toml --bin franklin-hardware-monitor -- --sim
  - race_recorder:
      layout: main-horizontal
      panes:
        - recorder:
            - echo "Waiting for services to be ready..."
            - sleep 3
            - echo "Starting Race Recorder (authoritative; owns recording + DB)..."
            - python franklin-race-recorder.py
  - tui:
      layout: main-horizontal
      panes:
        - tui:
            - echo "Waiting for services to be ready..."
            - sleep 3
            - echo "Starting Franklin TUI..."
            - python franklin-tui.py
  - web_scoreboard:
      layout: main-horizontal
      panes:
        - server:
            - echo "Waiting for services to be ready..."
            - sleep 4
            - echo "Starting Web Server with reflex..."
            - reflex -r '^(scoreboard_web_app\.py|database\.py|static/)' -s -- python scoreboard_web_app.py
  - web_referee:
      layout: main-horizontal
      panes:
        - server:
            - echo "Waiting for services to be ready..."
            - sleep 4
            - echo "Starting Referee Web Server with reflex..."
            - reflex -r '^(referee_web_app\.py|database\.py|static/)' -s -- python referee_web_app.py
  - web_healthcheck:
      layout: main-horizontal
      panes:
        - server:
            - echo "Waiting for services to be ready..."
            - sleep 4
            - echo "Starting Health Check Web Server with reflex..."
            - reflex -r '^(healthcheck_web_app\.py|static/)' -s -- python healthcheck_web_app.py
  - web_driver:
      layout: main-horizontal
      panes:
        - server:
            - echo "Waiting for services to be ready..."
            - sleep 4
            - echo "Starting Driver Web Server with reflex..."
            - reflex -r '^(driver_web_app\.py|database\.py|static/)' -s -- python driver_web_app.py
  - logs:
      layout: main-horizontal
      panes:
        - system:
            - echo "Opening logs in lnav..."
            - touch race.log hardware_redis.log redis.log
            - if [ -r /var/log/syslog ]; then lnav race.log hardware_redis.log redis.log /var/log/syslog; else lnav race.log hardware_redis.log redis.log; fi

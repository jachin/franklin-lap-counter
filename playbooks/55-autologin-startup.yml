---
- name: Configure console for Franklin systemd TUI (no autologin/tmuxinator)
  hosts: all
  become: true
  vars:
    getty_service: "getty@{{ franklin_autologin_tty }}.service"
    getty_override_dir: "/etc/systemd/system/{{ getty_service }}.d"
    getty_override_file: "{{ getty_override_dir }}/autologin.conf"

  tasks:
    # The Franklin TUI is launched by systemd (franklin-tui.service) directly on
    # the console VT. It declares Conflicts=getty@tty1, so the agetty that would
    # otherwise occupy tty1 must be masked; otherwise getty.target respawns it and
    # the two fight for the VT. We do NOT use autologin/tmuxinator anymore — that
    # path spawned a second, redundant stack and (headless) a 100% CPU spin.
    - name: Mask the console agetty so the systemd TUI owns the VT
      ansible.builtin.systemd:
        name: "{{ getty_service }}"
        enabled: false
        masked: true
        state: stopped
      register: getty_masked

    - name: Remove stale autologin override drop-in
      ansible.builtin.file:
        path: "{{ getty_override_file }}"
        state: absent

    - name: Reload systemd after masking getty
      ansible.builtin.systemd:
        daemon_reload: true

    # Defense in depth: ensure nothing in the login shell auto-launches
    # tmuxinator/tmux. The TUI is fully systemd-managed now.
    - name: Remove franklin zsh login autostart block
      ansible.builtin.blockinfile:
        path: "{{ franklin_home }}/.zprofile"
        owner: "{{ franklin_user }}"
        group: "{{ franklin_group }}"
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED FRANKLIN AUTOSTART"
        block: ""
        state: absent

    - name: Ensure franklin.target is enabled
      ansible.builtin.systemd:
        name: franklin.target
        enabled: true
